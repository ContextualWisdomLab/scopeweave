apiVersion: apps/v1
kind: Deployment
metadata:
  name: scopeweave-deployment
  labels:
    app: scopeweave
spec:
  replicas: 2
  selector:
    matchLabels:
      app: scopeweave
  template:
    metadata:
      labels:
        app: scopeweave
    spec:
      containers:
      - name: scopeweave
        image: scopeweave:v1.0.0
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"