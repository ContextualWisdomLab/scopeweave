name: Patch attachment repair browser setup

on:
  push:
    branches:
      - jules-promise-all-attachments-7315426299343398085

permissions:
  contents: write

concurrency:
  group: patch-attachment-repair-browser
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: jules-promise-all-attachments-7315426299343398085
          fetch-depth: 0
          persist-credentials: true

      - name: Add Playwright browser installation and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/repair-attachment-status-refresh.yml')
          text = path.read_text(encoding='utf-8')
          target = '          npm run test:e2e:cloud\n'
          replacement = '          npx playwright install --with-deps chromium\n' + target
          if 'npx playwright install --with-deps chromium' not in text:
              if text.count(target) != 1:
                  raise SystemExit(f'expected one cloud E2E command, found {text.count(target)}')
              path.write_text(text.replace(target, replacement, 1), encoding='utf-8')
          PY
          rm .github/workflows/patch-attachment-repair-browser.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ci: install Chromium for attachment repair validation'
          git push origin HEAD:jules-promise-all-attachments-7315426299343398085
