name: One-shot webhook SSRF repair

on:
  push:
    branches:
      - sentinel-ssrf-webhooks-1668440070062097017

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Node 22.13
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Refuse concurrent branch movement
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_REF_NAME}"
          test "$(git rev-parse "origin/${GITHUB_REF_NAME}")" = "${GITHUB_SHA}"

      - name: Apply root-cause repair
        run: python3 scripts/one-shot-ssrf-green.py

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Focused API security GREEN
        run: node tests/api/webhook-ssrf.test.mjs

      - name: Focused adapter GREEN
        run: node tests/unit/webhook-delivery.test.mjs

      - name: Full API GREEN
        run: npm run test:api

      - name: Full unit GREEN
        run: npm run test:unit

      - name: Coverage GREEN
        run: npm run test:coverage

      - name: Static documentation evidence
        run: npm run check:python-docstrings

      - name: Remove source-fix machinery and push only if head is unchanged
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-shot-ssrf-green.yml scripts/one-shot-ssrf-green.py
          git diff --check
          git fetch origin "${GITHUB_REF_NAME}"
          test "$(git rev-parse "origin/${GITHUB_REF_NAME}")" = "${GITHUB_SHA}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(security): enforce webhook destination network boundary'
          git push origin "HEAD:${GITHUB_REF_NAME}"
