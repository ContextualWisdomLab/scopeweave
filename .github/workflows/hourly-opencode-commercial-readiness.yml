name: Hourly OpenCode commercial readiness

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/hourly-opencode-commercial-readiness.yml
      - .github/prompts/hourly-commercial-readiness.md
      - scripts/ci/hourly_commercial_readiness_contract.py
      - tests/config/test_hourly_commercial_readiness.py
      - docs/adr/ADR-2026-08-08-hourly-commercial-readiness-rca.md
      - docs/doctoring/hourly-commercial-readiness-rca.md

permissions: read-all

concurrency:
  group: hourly-opencode-commercial-readiness-${{ github.repository }}
  cancel-in-progress: false

env:
  OPENCODE_VERSION: "1.18.13"
  OPENCODE_ARCHIVE_SHA256: "8d500b20fed2d26e537e221895b1a575476571b4f0089bb29fb13eeb8eb9e937"
  OPENCODE_NIM_MODEL: "mistralai/mistral-nemotron"

jobs:
  contract:
    name: Hourly scheduler contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify schedule, provider, RCA, and feasibility contracts
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python3 scripts/ci/hourly_commercial_readiness_contract.py contract --root .
          python3 -m unittest -v tests/config/test_hourly_commercial_readiness.py
          python3 -m compileall -q \
            scripts/ci/hourly_commercial_readiness_contract.py \
            tests/config/test_hourly_commercial_readiness.py
          git diff --check

  commercial_readiness:
    name: RCA, repair, verify, and publish one bounded target
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    permissions:
      actions: read
      checks: read
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out protected develop baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false

      - name: Capture the live queue and select one writer target
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          mkdir -p .opencode
          base_sha="$(git rev-parse HEAD)"
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
            --json number,title,isDraft,headRefName,headRefOid,baseRefName,updatedAt,author,authorAssociation,headRepositoryOwner \
            > .opencode/open-pull-requests.json
          gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
            --json number,title,labels,updatedAt \
            > .opencode/open-issues.json

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          pulls = json.loads(Path('.opencode/open-pull-requests.json').read_text(encoding='utf-8'))
          issues = json.loads(Path('.opencode/open-issues.json').read_text(encoding='utf-8'))
          trusted = {'OWNER', 'MEMBER', 'COLLABORATOR'}
          same_repository = [
              pull for pull in pulls
              if pull.get('authorAssociation') in trusted
              and (pull.get('headRepositoryOwner') or {}).get('login') == 'ContextualWisdomLab'
          ]
          same_repository.sort(
              key=lambda pull: (
                  bool(pull.get('isDraft')),
                  pull.get('updatedAt') or '',
                  int(pull['number']),
              )
          )
          selected_pull = same_repository[0] if same_repository else None
          labelled = [
              issue for issue in issues
              if any(
                  str((label or {}).get('name') or '').casefold()
                  in {'commercial-readiness', 'buyer-gap', 'product-gap'}
                  for label in issue.get('labels') or []
              )
          ]
          labelled.sort(key=lambda issue: (issue.get('updatedAt') or '', int(issue['number'])))
          selected_issue = labelled[0] if labelled else None
          if selected_pull:
              target = {
                  'schema_version': 1,
                  'target_kind': 'pull_request',
                  'target_id': f"scopeweave#{selected_pull['number']}",
                  'pr_number': int(selected_pull['number']),
                  'issue_number': None,
                  'head_branch': selected_pull['headRefName'],
                  'exact_head_sha': selected_pull['headRefOid'],
                  'base_branch': selected_pull['baseRefName'],
                  'base_sha': os.environ['BASE_SHA'],
                  'draft': bool(selected_pull.get('isDraft')),
              }
          else:
              target = {
                  'schema_version': 1,
                  'target_kind': 'product_gap',
                  'target_id': (
                      f"scopeweave-issue#{selected_issue['number']}"
                      if selected_issue else 'scopeweave-buyer-gap-discovery'
                  ),
                  'pr_number': None,
                  'issue_number': int(selected_issue['number']) if selected_issue else None,
                  'head_branch': None,
                  'exact_head_sha': os.environ['BASE_SHA'],
                  'base_branch': 'develop',
                  'base_sha': os.environ['BASE_SHA'],
                  'draft': True,
              }
          Path('.opencode/target.json').write_text(
              json.dumps(target, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ steps.target.outputs.base_sha || '' }}

      - name: Normalize target identity and check out its exact head
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          target_kind="$(jq -r '.target_kind' .opencode/target.json)"
          expected_head="$(jq -r '.exact_head_sha' .opencode/target.json)"
          if [[ "$target_kind" == 'pull_request' ]]; then
            pr_number="$(jq -r '.pr_number' .opencode/target.json)"
            gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" \
              --json number,title,body,isDraft,mergeStateStatus,reviewDecision,reviews,comments,statusCheckRollup,files \
              > .opencode/pull-request-context.json
            head_branch="$(jq -r '.head_branch' .opencode/target.json)"
            git fetch origin "${head_branch}:refs/remotes/origin/${head_branch}"
            git checkout --detach "$expected_head"
          else
            git checkout --detach "$expected_head"
            issue_number="$(jq -r '.issue_number // empty' .opencode/target.json)"
            if [[ -n "$issue_number" ]]; then
              gh issue view "$issue_number" --repo "$GITHUB_REPOSITORY" \
                --json number,title,labels > .opencode/issue-context.json
            else
              printf '{"discovery":"derive one bounded buyer-visible gap from checked-in product evidence"}\n' \
                > .opencode/issue-context.json
            fi
          fi
          test "$(git rev-parse HEAD)" = "$expected_head"
          printf 'target_kind=%s\n' "$target_kind" >> "$GITHUB_OUTPUT"
          printf 'start_sha=%s\n' "$expected_head" >> "$GITHUB_OUTPUT"
          printf 'pr_number=%s\n' "$(jq -r '.pr_number // empty' .opencode/target.json)" >> "$GITHUB_OUTPUT"
          printf 'head_branch=%s\n' "$(jq -r '.head_branch // empty' .opencode/target.json)" >> "$GITHUB_OUTPUT"

      - name: Install checksum-pinned OpenCode
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/opencode-linux-x64.tar.gz"
          install_root="${RUNNER_TEMP}/opencode-bin"
          mkdir -p "$install_root"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "https://github.com/anomalyco/opencode/releases/download/v${OPENCODE_VERSION}/opencode-linux-x64.tar.gz"
          printf '%s  %s\n' "$OPENCODE_ARCHIVE_SHA256" "$archive" | sha256sum --check --strict
          member_count="$(tar -tzf "$archive" | awk '$0 == "opencode" {count += 1} END {print count + 0}')"
          test "$member_count" -eq 1
          tar -xzf "$archive" -C "$install_root" --no-same-owner --no-same-permissions opencode
          chmod 0755 "$install_root/opencode"
          test "$($install_root/opencode --version)" = "$OPENCODE_VERSION"
          printf '%s\n' "$install_root" >> "$GITHUB_PATH"

      - name: Run one bounded OpenCode RCA and implementation attempt with NVIDIA NIM
        env:
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          ASSIGNMENT_PATH: .github/prompts/hourly-commercial-readiness.md
          OPENCODE_CONFIG_CONTENT: >-
            {"$schema":"https://opencode.ai/config.json","model":"nvidia/mistralai/mistral-nemotron","permission":{"read":"allow","glob":"allow","grep":"allow","edit":"allow","write":"allow","bash":"allow","webfetch":"deny","websearch":"deny","task":"deny"}}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          test -n "$NVIDIA_NIM_API_KEY"
          test "$(git rev-parse HEAD)" = "${{ steps.identity.outputs.start_sha }}"
          isolated_home="${RUNNER_TEMP}/opencode-home"
          mkdir -m 0700 "$isolated_home"
          env -i \
            HOME="$isolated_home" \
            PATH="$PATH" \
            CI=true \
            LANG=C.UTF-8 \
            LC_ALL=C.UTF-8 \
            NVIDIA_API_KEY="$NVIDIA_NIM_API_KEY" \
            OPENCODE_CONFIG_CONTENT="$OPENCODE_CONFIG_CONTENT" \
            opencode run \
              --model "nvidia/${OPENCODE_NIM_MODEL}" \
              --format json \
              "$(cat "$ASSIGNMENT_PATH")"

      - name: Validate RCA, writer lease, and protected-path boundaries
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.identity.outputs.start_sha }}"
          python3 scripts/ci/hourly_commercial_readiness_contract.py rca .opencode/rca.json
          test -s .opencode/outcome.json
          changed_paths="$({ git diff --name-only --diff-filter=ACMRTUXB; git ls-files --others --exclude-standard; } | sort -u)"
          printf '%s\n' "$changed_paths" > .opencode/changed-paths.txt
          if printf '%s\n' "$changed_paths" | grep -E '(^|/)(CODEOWNERS|SECURITY\.md)$|^\.github/workflows/(.*(coderabbit|noema|opencode-review|strix|security-review).*)\.ya?ml$'; then
            echo 'The agent modified a protected reviewer, security, or ownership boundary.' >&2
            exit 1
          fi
          if git diff -- . ':!*.lock' | grep -E '(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|NVIDIA_NIM_API_KEY[[:space:]]*[:=][[:space:]]*[^$<{[:space:]])'; then
            echo 'A credential-like literal was introduced.' >&2
            exit 1
          fi
          git diff --check

      - name: Run complete deterministic product verification
        env:
          CI: "true"
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          npm ci
          npm run test:unit
          npm run test:api
          npm run coverage
          node scripts/ci/static_coverage_evidence.mjs docstrings
          if git diff --name-only | grep -E '^(app\.js|cloud-sync\.js|index\.html|styles\.css|tests/e2e/)'; then
            npx playwright install --with-deps chromium
            npm run test:e2e
          fi
          git diff --check

      - name: Publish only an unchanged-lease verified head
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_KIND: ${{ steps.identity.outputs.target_kind }}
          START_SHA: ${{ steps.identity.outputs.start_sha }}
          EXISTING_PR: ${{ steps.identity.outputs.pr_number }}
          EXISTING_BRANCH: ${{ steps.identity.outputs.head_branch }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          rm -rf .opencode
          git add -A
          if git diff --cached --quiet; then
            printf 'pr_number=%s\n' "$EXISTING_PR" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: advance verified commercial readiness'
          publication_sha="$(git rev-parse HEAD)"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if [[ "$TARGET_KIND" == 'pull_request' ]]; then
            live_head="$(gh pr view "$EXISTING_PR" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')"
            test "$live_head" = "$START_SHA"
            git push --force-with-lease="refs/heads/${EXISTING_BRANCH}:${START_SHA}" \
              origin "HEAD:refs/heads/${EXISTING_BRANCH}"
            pr_number="$EXISTING_PR"
          else
            live_develop="$(git ls-remote origin refs/heads/develop | cut -f1)"
            test "$live_develop" = "$START_SHA"
            branch="automation/opencode-commercial-readiness-${GITHUB_RUN_ID}"
            git push origin "HEAD:refs/heads/${branch}"
            pr_url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base develop --head "$branch" --draft \
              --title 'feat: advance one verified commercial-readiness slice' \
              --body "OpenCode/NVIDIA NIM produced one bounded, RCA-gated product slice at exact verified commit \`${publication_sha}\`. This remains Draft until repository checks, independent review, documentation, coverage, and branch protection are satisfied.")"
            pr_number="${pr_url##*/}"
          fi
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          printf 'pr_number=%s\n' "$pr_number" >> "$GITHUB_OUTPUT"

      - name: Request independent current-head reviews and arm protected auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.publish.outputs.pr_number }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          test -n "$PR_NUMBER"
          exact_head="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "@coderabbitai review
          @cwl-noema-review
          @opencode-agent

          Please review exact current head \`${exact_head}\`. The hourly implementation loop completed its RCA realism gate and deterministic local verification. Review only; do not alter the branch, synthesize approval, merge, release, or weaken protection."
          is_draft="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')"
          enable_auto_merge=true
          if [[ "$is_draft" == 'false' && "$enable_auto_merge" == 'true' ]]; then
            gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --auto || true
          fi

      - name: Preserve bounded RCA and outcome evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hourly-commercial-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .opencode/target.json
            .opencode/rca.json
            .opencode/outcome.json
            .opencode/changed-paths.txt
          if-no-files-found: warn
          retention-days: 14
