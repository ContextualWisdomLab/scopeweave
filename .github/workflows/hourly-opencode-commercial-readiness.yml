name: Hourly ScopeWeave OpenCode Commercial Readiness

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Evaluate the gate and prompt without running OpenCode
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "41 * * * *"

concurrency:
  group: scopeweave-hourly-opencode-commercial-readiness
  cancel-in-progress: false

# The default token is read-only. The single trusted publication step uses the
# job-scoped write token after the OpenCode process has exited. OpenCode receives
# only NVIDIA_API_KEY, which is sourced from NVIDIA_NIM_API_KEY.
permissions:
  contents: read

jobs:
  develop-one-bounded-slice:
    if: github.repository == 'ContextualWisdomLab/scopeweave'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
      issues: read
      pull-requests: write
    env:
      DEFAULT_BRANCH: develop
      DRY_RUN: ${{ inputs.dry_run || false }}
      OPENCODE_VERSION: "1.17.13"
      OPENCODE_SHA256: 157afa289d1a8d9372de0ce19ac726119b937a1f6b201808d46f06e4e59bb348
      OPENCODE_MODEL_CANDIDATES: >-
        nvidia-nim/nvidia/llama-3.3-nemotron-super-49b-v1.5
        nvidia-nim/nvidia/nemotron-3-super-120b-a12b
        nvidia-nim/deepseek-ai/deepseek-v4-pro
      OPENCODE_RUN_TIMEOUT_SECONDS: "2400"
    steps:
      - name: Enforce pull-request-first single-flight gate
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
        run: |
          set -euo pipefail

          if ! open_prs="$(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --limit 1 \
              --json number,url
          )"; then
            {
              echo "dispatch=false"
              echo "reason=pull_request_inventory_unavailable"
            } >>"$GITHUB_OUTPUT"
            echo "Pull-request inventory was unavailable; failing closed." \
              >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$(jq 'length' <<<"$open_prs")" -gt 0 ]; then
            {
              echo "dispatch=false"
              echo "reason=open_pull_request"
            } >>"$GITHUB_OUTPUT"
            echo "An open pull request exists; central PR governance owns this hour." \
              >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ -z "${NVIDIA_API_KEY:-}" ]; then
            {
              echo "dispatch=false"
              echo "reason=nim_api_key_unavailable"
            } >>"$GITHUB_OUTPUT"
            cat >>"$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          Autonomous development is disabled because `NVIDIA_NIM_API_KEY` is not configured.
          No Copilot subscription, Agent Tasks API, or fine-grained user token is used.
          SUMMARY
            exit 0
          fi

          {
            echo "dispatch=true"
            echo "reason=ready"
          } >>"$GITHUB_OUTPUT"

      - name: Prepare bounded commercial-quality assignment
        if: steps.gate.outputs.dispatch == 'true'
        shell: bash
        run: |
          cat >"$RUNNER_TEMP/scopeweave-agent-prompt.md" <<'PROMPT'
          Continue product development for ContextualWisdomLab/scopeweave on the develop branch.

          Start by reading AGENTS.md, README.md, CHANGELOG.md, docs/doctoring,
          docs/operations, the trusted open-issue and recently-merged-PR snapshots under
          .opencode-context, current source, tests, package contracts, service adapters,
          database schema, and release evidence. Select exactly one highest-impact,
          buyer-visible product, reliability, interoperability, security, evaluation,
          accessibility, or operations gap that can be completed as one bounded pull request.
          Do not create another repository or a broad platform rewrite.

          Preserve standalone ScopeWeave operation while keeping framework-independent seams
          suitable for ContextualWisdomLab/.github, naruon, Clearfolio,
          contextual-orchestrator, and future MSA adapters. Use or improve
          contextual-orchestrator for every product LLM path instead of adding a direct,
          provider-specific client. Treat all model output as untrusted, bounded, auditable
          input that requires deterministic validation before persistence or user-visible use.

          Work test-first: establish a failing realistic regression or executable contract
          before production code, confirm that it fails for the intended reason, and then
          implement the smallest coherent vertical slice. Never weaken, skip, delete,
          suppress, or mark a meaningful release-gate test expected-to-fail merely to obtain
          green output. Maintain 100% production statement, branch, function, and line
          coverage for each new or materially changed production module. Every public module,
          class, function, method, property, exported constant, security invariant, input,
          output, and exception must have beginner-readable JSDoc or docstrings.

          New database tables, columns, indexes, triggers, constraints, migration objects,
          and durable queues must use descriptive two-word-or-longer snake_case names. Preserve
          tenant isolation, least privilege, bounded resource use, idempotency, deterministic
          behavior where applicable, migration rollback, immutable audit evidence, and
          secret-free logs. Tests must model realistic multi-tenant projects, concurrent edits
          or requests, partial downstream failure, restart and migration behavior, large WBS
          inputs, accessibility, recovery, and customer-visible outputs as appropriate.

          Use the latest authoritative international standard, primary technical
          specification, or peer-reviewed paper for every material decision. Record the
          decision, limitations, executable evidence, and APA 7th references under
          docs/doctoring/. Distinguish source-supported claims, measurements, assumptions, and
          inference. Do not claim certification or compliance beyond executable evidence.

          Use Figma or Product Design only when the selected slice has a real buyer-facing UI.
          For such a slice, account for loading, empty, validation, error, keyboard,
          screen-reader, touch, narrow-viewport, and permission states. Do not manufacture
          design work for a backend-only or library-only increment.

          If an LLM-dependent test is genuinely necessary, use the established
          contextual-orchestrator boundary and NVIDIA_NIM_API_KEY in GitHub Actions; keep
          deterministic non-LLM tests as the required merge gate. Do not edit, copy, replace,
          or weaken CodeRabbit, Noema, OpenCode-review, Strix, security-review, organization
          rules, reviewer credentials, `.trivyignore`, or branch protection.

          Run focused tests, npm ci, complete unit and API suites, coverage and docstring
          gates, cloud browser E2E for user-visible changes, syntax and dependency checks,
          relevant adversarial/security tests, and git diff --check. Update CHANGELOG.md and
          all affected product, architecture, operations, security, accessibility, evaluation,
          migration, and rollback documentation. Change package versions only when the
          integrated repository is genuinely release-ready. Do not merge, publish, release,
          push, or commit. Leave one bounded verified working-tree increment and create
          PR_MESSAGE.md at the repository root: first line is the proposed title, followed by
          a body with buyer impact, exact verification evidence, standards references, risks,
          compatibility, and residual gaps. A trusted workflow step will publish the branch;
          central PR governance owns review, repair, exact-head checks, approval, and merge.
          PROMPT

      - name: Record dry-run decision
        if: steps.gate.outputs.dispatch == 'true' && env.DRY_RUN == 'true'
        shell: bash
        run: |
          {
            echo "Dry run: one bounded OpenCode/NVIDIA NIM development session would start."
            echo
            cat "$RUNNER_TEMP/scopeweave-agent-prompt.md"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Check out develop without persisted credentials
        if: steps.gate.outputs.dispatch == 'true' && env.DRY_RUN != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the supported Node.js runtime
        if: steps.gate.outputs.dispatch == 'true' && env.DRY_RUN != 'true'
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: 22.13.0
          cache: npm

      - name: Materialize trusted repository context
        if: steps.gate.outputs.dispatch == 'true' && env.DRY_RUN != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .opencode-context
          gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --limit 100 \
            --json number,title,body,labels,createdAt,updatedAt \
            >.opencode-context/open-issues.json
          gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state merged \
            --limit 30 \
            --json number,title,body,mergedAt,files \
            >.opencode-context/recent-merged-prs.json
          {
            echo /opencode.json
            echo /.opencode-context/
          } >>.git/info/exclude

      - name: Install the pinned OpenCode CLI
        if: steps.gate.outputs.dispatch == 'true' && env.DRY_RUN != 'true'
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/opencode-linux-x64.tar.gz"
          install_dir="${HOME}/.opencode/bin"
          mkdir -p "$install_dir"
          curl -fsSL \
            -o "$archive" \
            "https://github.com/anomalyco/opencode/releases/download/v${OPENCODE_VERSION}/opencode-linux-x64.tar.gz"
          printf '%s  %s\n' "$OPENCODE_SHA256" "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          install -m 0755 "${RUNNER_TEMP}/opencode" "${install_dir}/opencode"
          "${install_dir}/opencode" --version
          echo "$install_dir" >>"$GITHUB_PATH"

      - name: Configure OpenCode for NVIDIA NIM
        if: steps.gate.outputs.dispatch == 'true' && env.DRY_RUN != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat >"$GITHUB_WORKSPACE/opencode.json" <<'CONFIG'
          {
            "$schema": "https://opencode.ai/config.json",
            "enabled_providers": ["nvidia-nim"],
            "model": "nvidia-nim/nvidia/llama-3.3-nemotron-super-49b-v1.5",
            "small_model": "nvidia-nim/meta/llama-3.3-70b-instruct",
            "provider": {
              "nvidia-nim": {
                "npm": "@ai-sdk/openai-compatible",
                "name": "NVIDIA NIM",
                "options": {
                  "baseURL": "https://integrate.api.nvidia.com/v1",
                  "apiKey": "{env:NVIDIA_API_KEY}"
                },
                "models": {
                  "nvidia/llama-3.3-nemotron-super-49b-v1.5": {
                    "name": "NVIDIA Llama 3.3 Nemotron Super 49B v1.5",
                    "tool_call": true,
                    "limit": {"context": 131072, "output": 8192}
                  },
                  "nvidia/nemotron-3-super-120b-a12b": {
                    "name": "NVIDIA Nemotron 3 Super 120B",
                    "tool_call": true,
                    "limit": {"context": 131072, "output": 8192}
                  },
                  "deepseek-ai/deepseek-v4-pro": {
                    "name": "DeepSeek V4 Pro (NIM)",
                    "tool_call": true,
                    "limit": {"context": 131072, "output": 8192}
                  },
                  "meta/llama-3.3-70b-instruct": {
                    "name": "Meta Llama 3.3 70B Instruct (NIM)",
                    "tool_call": true,
                    "limit": {"context": 131072, "output": 8192}
                  }
                }
              }
            }
          }
          CONFIG

      - name: Run the bounded NVIDIA NIM development agent
        if: steps.gate.outputs.dispatch == 'true' && env.DRY_RUN != 'true'
        shell: bash
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$NVIDIA_API_KEY"
          start_sha="$(git rev-parse HEAD)"
          printf '%s\n' "$start_sha" >"$RUNNER_TEMP/start-sha"
          prompt="$(cat "$RUNNER_TEMP/scopeweave-agent-prompt.md")"
          status=1
          for model in $OPENCODE_MODEL_CANDIDATES; do
            echo "::group::opencode $model"
            if timeout --kill-after=30s "${OPENCODE_RUN_TIMEOUT_SECONDS}s" \
              env -u GH_TOKEN -u GITHUB_TOKEN -u REPOSITORY_TOKEN \
              -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL \
              opencode run "$prompt" --model "$model"; then
              status=0
              echo "::endgroup::"
              echo "Agent session completed with \`$model\`." >>"$GITHUB_STEP_SUMMARY"
              break
            fi
            echo "::endgroup::"
            echo "::warning::Model $model failed; discarding partial work and trying the next candidate."
            git reset --hard "$start_sha"
            git clean -fd
          done
          if [ "$status" -ne 0 ]; then
            echo "::error::Every NVIDIA NIM model candidate failed; no work was proposed."
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$start_sha" ]; then
            echo "::error::The agent created commits; trusted publication requires working-tree-only output."
            exit 1
          fi

      - name: Enforce protected workflow and credential boundaries
        if: steps.gate.outputs.dispatch == 'true' && env.DRY_RUN != 'true'
        shell: bash
        run: |
          set -euo pipefail
          start_sha="$(cat "$RUNNER_TEMP/start-sha")"
          changed_files="$(
            {
              git diff --name-only "$start_sha"...HEAD
              git diff --name-only
              git ls-files --others --exclude-standard
            } | sort -u
          )"
          if [ -z "$changed_files" ]; then
            echo "No product change was produced." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if printf '%s\n' "$changed_files" | grep -E '^\.github/workflows/.*(coderabbit|noema|opencode-review|review-agent|strix|security-review).*\.ya?ml$'; then
            echo "::error::The development agent modified a protected review-agent workflow."
            exit 1
          fi
          if printf '%s\n' "$changed_files" | grep -E '(^|/)(\.trivyignore|\.semgrepignore|\.gitleaksignore)$'; then
            echo "::error::The development agent introduced or changed a security-scan suppression file."
            exit 1
          fi
          if git diff --no-ext-diff "$start_sha" -- . \
            | grep -E '(^|[^A-Za-z])(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|nvapi-[A-Za-z0-9_-]{20,})'; then
            echo "::error::A credential-like literal was introduced."
            exit 1
          fi
          git diff --check

      - name: Run the complete product verification contract
        if: steps.gate.outputs.dispatch == 'true' && env.DRY_RUN != 'true'
        shell: bash
        env:
          CI: "true"
        run: |
          set -euo pipefail
          npm ci
          npm run test:unit
          npm run test:api
          npm run coverage
          node scripts/ci/static_coverage_evidence.mjs docstrings
          if npm run | grep -q 'test:e2e:cloud'; then
            npm run test:e2e:cloud
          fi
          git diff --check

      - name: Revalidate queue ownership and open exactly one pull request
        if: steps.gate.outputs.dispatch == 'true' && env.DRY_RUN != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          rm -f opencode.json
          rm -rf .opencode-context

          if [ -z "$(git status --porcelain)" ]; then
            echo "The agent made no verified source change; nothing to propose this hour." \
              >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --limit 1 \
              --json number \
              --jq 'length'
          )" -ne 0 ]; then
            echo "A pull request appeared while the agent was running; refusing duplicate development." \
              >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          title="ScopeWeave autonomous commercial-readiness increment"
          body_file="$RUNNER_TEMP/pr-body.md"
          if [ -f PR_MESSAGE.md ]; then
            candidate_title="$(head -n 1 PR_MESSAGE.md | sed 's/^#\+ *//')"
            [ -n "$candidate_title" ] && title="$candidate_title"
            tail -n +2 PR_MESSAGE.md >"$body_file"
            rm -f PR_MESSAGE.md
          else
            cat >"$body_file" <<'BODY'
          Bounded OpenCode/NVIDIA NIM product increment. See the focused diff,
          executable verification, CHANGELOG.md, and doctoring record. Central PR
          governance remains responsible for independent review, repair, exact-head
          checks, approval, and merge.
          BODY
          fi

          branch="nim-agent/product-dev-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A
          git commit -m "$title"
          git push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${branch}"
          pr_url="$(
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base "$DEFAULT_BRANCH" \
              --head "$branch" \
              --title "$title" \
              --body-file "$body_file"
          )"
          {
            echo "Opened bounded pull request: $pr_url"
            echo "Central PR governance owns review, repair, revalidation, and merge."
          } >>"$GITHUB_STEP_SUMMARY"
