name: One-shot session auth repair

on:
  push:
    branches:
      - sentinel-fix-calendar-stream-revocation-11666540507854451077
    paths:
      - .github/workflows/one-shot-session-auth-repair.yml

permissions:
  contents: write

concurrency:
  group: one-shot-session-auth-repair
  cancel-in-progress: false

jobs:
  repair-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: sentinel-fix-calendar-stream-revocation-11666540507854451077
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js 22.13
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22.13.0
          cache: npm

      - name: Apply reviewed refactor and changelog entry
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('server/app.mjs')
          text = path.read_text(encoding='utf-8')

          anchor = "export const app = new Hono();\n\n"
          helper = """/**
           * Verify a session JWT and enforce database-backed global revocation.
           *
           * @param {string} token Serialized session JWT.
           * @returns {Record<string, unknown>} Verified JWT payload.
           * @throws {Error} When the token is invalid, expired, references a missing user, or is revoked.
           */
          function verifySessionJwt(token) {
            const payload = verifyToken(token);
            const user = db.prepare('SELECT token_version FROM users WHERE id = ?').get(payload.sub);
            if (!user || (payload.tv || 0) !== user.token_version) throw new Error('revoked session');
            return payload;
          }

          """
          if text.count(anchor) != 1:
            raise SystemExit('expected one app export anchor')
          text = text.replace(anchor, anchor + helper, 1)

          require_old = """  try {
            const payload = verifyToken(token);
            // Session revocation: a bumped token_version invalidates all older JWTs.
            const u = db.prepare('SELECT token_version FROM users WHERE id = ?').get(payload.sub);
            if (!u || (payload.tv || 0) !== u.token_version) return c.json({ error: 'unauthorized' }, 401);
            c.set('user', payload);
          } catch {
            return c.json({ error: 'unauthorized' }, 401);
          }
          """
          require_new = """  try {
            c.set('user', verifySessionJwt(token));
          } catch {
            return c.json({ error: 'unauthorized' }, 401);
          }
          """
          if text.count(require_old) != 1:
            raise SystemExit('expected one requireAuth JWT block')
          text = text.replace(require_old, require_new, 1)

          url_old = """    try {
              const payload = verifyToken(raw);
              const u = db.prepare('SELECT token_version FROM users WHERE id = ?').get(payload.sub);
              if (!u || (payload.tv || 0) !== u.token_version) return c.json({ error: 'unauthorized' }, 401);
              uid = payload.sub;
            } catch { return c.json({ error: 'unauthorized' }, 401); }
          """
          url_new = """    try {
              uid = verifySessionJwt(raw).sub;
            } catch { return c.json({ error: 'unauthorized' }, 401); }
          """
          if text.count(url_old) != 2:
            raise SystemExit(f'expected calendar and attachment JWT blocks, found {text.count(url_old)}')
          text = text.replace(url_old, url_new)

          stream_old = """  try {
            user = verifyToken(token);
            const u = db.prepare('SELECT token_version FROM users WHERE id = ?').get(user.sub);
            if (!u || (user.tv || 0) !== u.token_version) return c.json({ error: 'unauthorized' }, 401);
          } catch { return c.json({ error: 'unauthorized' }, 401); }
          """
          stream_new = """  try {
            user = verifySessionJwt(token);
          } catch { return c.json({ error: 'unauthorized' }, 401); }
          """
          if text.count(stream_old) != 1:
            raise SystemExit('expected one stream JWT block')
          text = text.replace(stream_old, stream_new, 1)

          if text.count('verifySessionJwt(') != 5:
            raise SystemExit('helper must be defined and used by four authentication paths')
          path.write_text(text, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          log = changelog.read_text(encoding='utf-8')
          changed = '### Changed\n'
          fixed = """### Fixed

          - Enforced database-backed session revocation consistently for bearer middleware,
            calendar feeds, server-sent events, and attachment-view URL tokens.

          """
          if fixed.strip() not in log:
            if log.count(changed) != 1:
              raise SystemExit('expected one Unreleased Changed heading')
            log = log.replace(changed, fixed + changed, 1)
            changelog.write_text(log, encoding='utf-8')
          PY

          rm .github/workflows/one-shot-session-auth-repair.yml
          test ! -e pnpm-lock.yaml
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Run API regression tests
        run: npm run test:api

      - name: Run coverage gate
        run: npm run coverage

      - name: Run cloud E2E regression
        run: npm run test:e2e:cloud

      - name: Commit verified repair and remove one-shot workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/app.mjs CHANGELOG.md .github/workflows/one-shot-session-auth-repair.yml
          git diff --cached --check
          git commit -m "refactor(auth): centralize revoked session validation"
          git push origin HEAD:sentinel-fix-calendar-stream-revocation-11666540507854451077
