# Enforce the SaaS backend + analytics test suites on every PR.
# Until this workflow, test:api / test:unit / the cloud e2e spec existed but
# were never run by CI.
name: Server Tests

on:
  # No base-branch filter: stacked PRs target feature branches, and their tests
  # must run there too — not only after retarget to develop.
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: server-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: pnpm install
      - name: Unit tests (EVM · CPM · baseline · workload)
        run: pnpm run test:unit
      - name: API tests (auth · tenancy · RBAC · billing · webhooks · rate limit)
        run: pnpm run test:api
      - name: app.js stays eval-safe (no top-level import/export)
        run: node -e "new Function(require('fs').readFileSync('app.js','utf8')); console.log('eval-safe OK')"

  cloud-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: pnpm install
      - name: Install Playwright (chromium)
        run: npx playwright install chromium --with-deps
      - name: Cloud UI e2e
        run: pnpm run test:e2e:cloud
