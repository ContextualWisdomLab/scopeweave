name: Fuzz

on:
  pull_request:
    branches:
      - develop
      - master
  push:
    branches:
      - develop
  schedule:
    # Nightly deeper run (03:17 UTC) with a much larger iteration budget.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      fuzz_runs:
        description: 'fast-check iterations per property'
        required: false
        default: '20000'

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: property fuzz
    runs-on: ubuntu-latest
    # Hard wall-clock cap so the job can never blow up CI cost.
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact checkout
        env:
          EXPECTED_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_CHECKOUT_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.13.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Select iteration budget
        id: budget
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_FUZZ_RUNS: ${{ github.event.inputs.fuzz_runs }}
        run: |
          runs="$(bash scripts/ci/select_fuzz_budget.sh "$EVENT_NAME" "$INPUT_FUZZ_RUNS")"
          printf 'runs=%s\n' "$runs" >> "$GITHUB_OUTPUT"

      - name: Run property fuzz targets
        env:
          # Bounded per-property iteration count; the 10-minute job timeout is
          # the hard ceiling. PRs stay short (~60-120s total), nightly digs deeper.
          FUZZ_RUNS: ${{ steps.budget.outputs.runs }}
        run: npm run fuzz
