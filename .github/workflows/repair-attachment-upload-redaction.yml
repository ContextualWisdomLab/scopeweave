name: Repair attachment upload identifier disclosure

on:
  push:
    branches:
      - fix/security-hono-attachment-refresh-final
    paths:
      - .github/workflows/repair-attachment-upload-redaction.yml

permissions:
  contents: write

concurrency:
  group: repair-attachment-upload-redaction
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/security-hono-attachment-refresh-final
          fetch-depth: 0

      - name: Set up supported Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: 22.13.0
          cache: npm

      - name: Apply exact redaction regression
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          app = Path('server/app.mjs')
          text = app.read_text(encoding='utf-8')
          old = "  return c.json({ id: aid, jobId: job.jobId, status: job.status });"
          new = "  return c.json({ id: aid, status: job.status });"
          if text.count(old) != 1:
              raise SystemExit('attachment upload response contract changed unexpectedly')
          app.write_text(text.replace(old, new), encoding='utf-8')

          smoke = Path('tests/api/smoke.mjs')
          text = smoke.read_text(encoding='utf-8')
          old = "  assert.ok(att.id && att.jobId.startsWith('mockcf-'), 'mock job id');"
          new = "  assert.ok(att.id, 'attachment id');\n  assert.equal(Object.hasOwn(att, 'jobId'), false, 'internal job id omitted');"
          if text.count(old) != 1:
              raise SystemExit('attachment smoke assertion changed unexpectedly')
          smoke.write_text(text.replace(old, new), encoding='utf-8')

          focused = Path('tests/api/attachment-status.test.mjs')
          text = focused.read_text(encoding='utf-8')
          old = "  assert.equal(response.status, 200);\n  return response.json();\n}"
          new = "  assert.equal(response.status, 200);\n  const payload = await response.json();\n  assert.equal(Object.hasOwn(payload, 'jobId'), false);\n  return payload;\n}"
          if text.count(old) != 1:
              raise SystemExit('focused upload helper changed unexpectedly')
          focused.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Verify focused and complete contracts
        shell: bash
        env:
          CI: "true"
        run: |
          set -euo pipefail
          npm ci
          node tests/api/smoke.mjs
          node tests/api/attachment-status.test.mjs
          npm run test:unit
          npm run test:api
          npm run coverage
          node scripts/ci/static_coverage_evidence.mjs docstrings
          git diff --check

      - name: Publish verified repair and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/repair-attachment-upload-redaction.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(attachments): keep conversion identifiers internal"
          git push origin HEAD:fix/security-hono-attachment-refresh-final
