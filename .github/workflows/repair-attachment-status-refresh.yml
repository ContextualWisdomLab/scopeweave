name: Repair attachment status refresh

on:
  pull_request:
    branches: [develop]
    types: [ready_for_review]

permissions:
  contents: write

concurrency:
  group: repair-attachment-status-refresh-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.event.pull_request.number == 420 && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: jules-promise-all-attachments-7315426299343398085
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22.13.0
          cache: npm

      - name: Patch the attachment-list integration
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('server/app.mjs')
          text = path.read_text(encoding='utf-8')

          clearfolio_import = "import { clearfolioMock, mockArtifact, submitJob, jobStatus, artifactUrl } from './clearfolio.mjs';\n"
          refresh_import = "import { normalizeAttachmentStatusConcurrency, normalizeAttachmentStatusTimeoutMs, refreshAttachmentStatuses } from './attachment_status.mjs';\n"
          if refresh_import not in text:
              if text.count(clearfolio_import) != 1:
                  raise SystemExit('clearfolio import marker is not unique')
              text = text.replace(clearfolio_import, clearfolio_import + refresh_import, 1)

          metrics_old = "const metrics = { startedAt: new Date().toISOString(), requests: 0, s2xx: 0, s4xx: 0, s5xx: 0, signups: 0, projectsCreated: 0, webhookDeliveries: 0 };"
          metrics_new = """const metrics = {
            startedAt: new Date().toISOString(),
            requests: 0,
            s2xx: 0,
            s4xx: 0,
            s5xx: 0,
            signups: 0,
            projectsCreated: 0,
            webhookDeliveries: 0,
            attachmentStatusRefreshAttempted: 0,
            attachmentStatusRefreshChanged: 0,
            attachmentStatusRefreshFailed: 0,
            attachmentStatusRefreshDeferred: 0,
          };"""
          if 'attachmentStatusRefreshAttempted' not in text:
              if text.count(metrics_old) != 1:
                  raise SystemExit('metrics marker is not unique')
              text = text.replace(metrics_old, metrics_new, 1)

          constant_marker = 'const ATTACH_MAX_BYTES = 10 * 1024 * 1024;\n'
          constant_block = """const ATTACH_STATUS_CONCURRENCY = normalizeAttachmentStatusConcurrency(
            process.env.SCOPEWEAVE_ATTACHMENT_STATUS_CONCURRENCY,
          );
          const ATTACH_STATUS_TIMEOUT_MS = normalizeAttachmentStatusTimeoutMs(
            process.env.SCOPEWEAVE_ATTACHMENT_STATUS_TIMEOUT_MS,
          );
          const updateAttachmentStatusStatement = db.prepare(
            'UPDATE attachments SET status = ? WHERE id = ?',
          );
          """
          if 'const ATTACH_STATUS_CONCURRENCY' not in text:
              if text.count(constant_marker) != 1:
                  raise SystemExit('attachment constant marker is not unique')
              text = text.replace(constant_marker, constant_marker + constant_block, 1)

          route_marker = "app.get('/api/projects/:id/attachments', requireAuth, async (c) => {"
          route_start = text.index(route_marker)
          body_start = text.index("  const taskId = c.req.query('taskId');", route_start)
          body_end_marker = '  return c.json({ attachments: rows });'
          body_end = text.index(body_end_marker, body_start) + len(body_end_marker)
          new_body = """  const taskId = c.req.query('taskId');
            const rows = (taskId
              ? db.prepare(`SELECT a.id, a.task_id AS taskId, a.name, a.mime, a.size, a.job_id AS jobId, a.status, a.created_at AS createdAt, u.email AS uploadedBy
                  FROM attachments a LEFT JOIN users u ON u.id = a.created_by
                  WHERE a.project_id = ? AND a.task_id = ? ORDER BY a.id DESC`).all(p.id, taskId)
              : db.prepare(`SELECT a.id, a.task_id AS taskId, a.name, a.mime, a.size, a.job_id AS jobId, a.status, a.created_at AS createdAt, u.email AS uploadedBy
                  FROM attachments a LEFT JOIN users u ON u.id = a.created_by
                  WHERE a.project_id = ? ORDER BY a.id DESC`).all(p.id));
            await refreshAttachmentStatuses(rows, {
              orgId: p.org_id,
              userId: uid,
              jobStatus,
              updateStatus: (status, attachmentId) =>
                updateAttachmentStatusStatement.run(status, attachmentId),
              concurrency: ATTACH_STATUS_CONCURRENCY,
              timeoutMs: ATTACH_STATUS_TIMEOUT_MS,
              metrics,
            });
            const attachments = rows.map(({ jobId: _internalJobId, ...publicRow }) => publicRow);
            return c.json({ attachments });"""
          text = text[:body_start] + new_body + text[body_end:]
          path.write_text(text, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run focused and full validation
        shell: bash
        run: |
          set -euo pipefail
          node tests/unit/attachment-status.test.mjs
          node tests/unit/clearfolio-status-signal.test.mjs
          node tests/api/attachment-status.test.mjs
          npm run test:unit
          npm run test:api
          npm run coverage
          node scripts/ci/static_coverage_evidence.mjs docstrings
          npm run test:e2e:cloud
          python3 - <<'PY'
          import json
          from pathlib import Path

          coverage = json.loads(Path('coverage/coverage-final.json').read_text())
          target = next(
              item for name, item in coverage.items()
              if name.replace('\\', '/').endswith('/server/attachment_status.mjs')
          )
          for label, values in (
              ('statements', target['s'].values()),
              ('functions', target['f'].values()),
              ('branches', (hit for hits in target['b'].values() for hit in hits)),
          ):
              values = list(values)
              if not values or any(hit == 0 for hit in values):
                  raise SystemExit(f'attachment_status.mjs lacks 100% {label} coverage')
          PY
          git diff --check

      - name: Commit only the verified implementation
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/repair-attachment-status-refresh.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'perf(attachments): bound status refresh and remove N+1 queries'
          git push origin HEAD:jules-promise-all-attachments-7315426299343398085
