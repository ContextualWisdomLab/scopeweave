name: Repair PR 419 coverage evidence

on:
  push:
    branches:
      - dependabot/npm_and_yarn/npm_and_yarn-a27be0ffa6

permissions: read-all

concurrency:
  group: repair-pr-419-coverage
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: dependabot/npm_and_yarn/npm_and_yarn-a27be0ffa6
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22.13.0
          cache: npm

      - name: Apply review and coverage fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import json

          package_path = Path('package.json')
          package = json.loads(package_path.read_text(encoding='utf-8'))
          scripts = package['scripts']
          coverage_includes = (
              '--all --include=app.js --include=cloud-sync.js '
              '--include=scripts/ci/static_coverage_evidence.mjs '
              '--include=server/attachment_status.mjs --include=server/app.mjs '
              '--include=server/auth.mjs --include=server/clearfolio.mjs '
              '--reporter=json --reporter=json-summary'
          )
          coverage_cases = (
              'node tests/unit/coverage-script-contract.test.mjs && '
              'node tests/unit/attachment-status.test.mjs && '
              'node tests/unit/clearfolio-status-signal.test.mjs && '
              'node tests/unit/msproject.test.mjs && '
              'node tests/unit/auth-password.test.mjs && '
              'node tests/unit/editor-unsaved.test.mjs && '
              'node tests/unit/static-coverage-evidence.test.mjs && '
              'npm run test:api'
          )
          scripts['coverage'] = 'npm run test:coverage'
          scripts['test:coverage'] = f'c8 {coverage_includes} npm run test:coverage:cases'
          scripts['test:coverage:cases'] = coverage_cases
          contract_test = 'node tests/unit/coverage-script-contract.test.mjs'
          if contract_test not in scripts['test:unit']:
              scripts['test:unit'] += f' && {contract_test}'
          package_path.write_text(
              json.dumps(package, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          app_path = Path('server/app.mjs')
          app = app_path.read_text(encoding='utf-8')
          old_import = (
              "import { normalizeAttachmentStatusConcurrency, "
              "normalizeAttachmentStatusTimeoutMs, refreshAttachmentStatuses } "
              "from './attachment_status.mjs';"
          )
          new_import = (
              "import { normalizeAttachmentStatusBudgetMs, "
              "normalizeAttachmentStatusConcurrency, "
              "normalizeAttachmentStatusTimeoutMs, refreshAttachmentStatuses } "
              "from './attachment_status.mjs';"
          )
          if old_import in app:
              app = app.replace(old_import, new_import, 1)
          elif new_import not in app:
              raise SystemExit('attachment status import marker not found')

          old_constants = """const ATTACH_STATUS_CONCURRENCY = normalizeAttachmentStatusConcurrency(
            process.env.SCOPEWEAVE_ATTACHMENT_STATUS_CONCURRENCY,
          );
          const ATTACH_STATUS_TIMEOUT_MS = normalizeAttachmentStatusTimeoutMs(
            process.env.SCOPEWEAVE_ATTACHMENT_STATUS_TIMEOUT_MS,
          );
          const updateAttachmentStatusStatement = db.prepare(
            'UPDATE attachments SET status = ? WHERE id = ?',
          );"""
          new_constants = """const ATTACH_STATUS_CONCURRENCY = normalizeAttachmentStatusConcurrency(
            process.env.SCOPEWEAVE_ATTACHMENT_STATUS_CONCURRENCY,
          );
          const ATTACH_STATUS_TIMEOUT_MS = normalizeAttachmentStatusTimeoutMs(
            process.env.SCOPEWEAVE_ATTACHMENT_STATUS_TIMEOUT_MS,
          );
          const ATTACH_STATUS_BUDGET_MS = normalizeAttachmentStatusBudgetMs(
            process.env.SCOPEWEAVE_ATTACHMENT_STATUS_BUDGET_MS,
          );
          const ATTACHMENT_LIST_COLUMNS = `a.id, a.task_id AS taskId, a.name, a.mime, a.size,
            a.job_id AS jobId, a.status, a.created_at AS createdAt, u.email AS uploadedBy`;
          const ATTACHMENT_LIST_FROM =
            'FROM attachments a LEFT JOIN users u ON u.id = a.created_by';
          const listAttachmentsStatement = db.prepare(
            `SELECT ${ATTACHMENT_LIST_COLUMNS} ${ATTACHMENT_LIST_FROM}
             WHERE a.project_id = ? ORDER BY a.id DESC`,
          );
          const listTaskAttachmentsStatement = db.prepare(
            `SELECT ${ATTACHMENT_LIST_COLUMNS} ${ATTACHMENT_LIST_FROM}
             WHERE a.project_id = ? AND a.task_id = ? ORDER BY a.id DESC`,
          );
          const updateAttachmentStatusStatement = db.prepare(
            'UPDATE attachments SET status = ? WHERE id = ?',
          );"""
          if old_constants in app:
              app = app.replace(old_constants, new_constants, 1)
          elif 'const ATTACH_STATUS_BUDGET_MS' not in app:
              raise SystemExit('attachment status constant marker not found')

          route_start = app.index("app.get('/api/projects/:id/attachments', requireAuth, async (c) => {")
          body_start = app.index("const taskId = c.req.query('taskId');", route_start)
          body_end_marker = 'return c.json({ attachments });'
          body_end = app.index(body_end_marker, body_start) + len(body_end_marker)
          new_body = """  const taskId = c.req.query('taskId');
            const rows = taskId
              ? listTaskAttachmentsStatement.all(p.id, taskId)
              : listAttachmentsStatement.all(p.id);
            await refreshAttachmentStatuses(rows, {
              orgId: p.org_id,
              userId: uid,
              jobStatus,
              updateStatus: (status, attachmentId) =>
                updateAttachmentStatusStatement.run(status, attachmentId),
              concurrency: ATTACH_STATUS_CONCURRENCY,
              timeoutMs: ATTACH_STATUS_TIMEOUT_MS,
              budgetMs: ATTACH_STATUS_BUDGET_MS,
              metrics,
            });
            const attachments = rows.map(({ jobId: _internalJobId, ...publicRow }) => publicRow);
            return c.json({ attachments });"""
          app = app[:body_start] + new_body + app[body_end:]
          app_path.write_text(app, encoding='utf-8')
          PY

          cat > tests/unit/coverage-script-contract.test.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';

          const packageJson = JSON.parse(
            readFileSync(new URL('../../package.json', import.meta.url), 'utf8'),
          );
          const scripts = packageJson.scripts;

          assert.equal(
            scripts.coverage,
            'npm run test:coverage',
            'the public coverage command delegates to the canonical coverage-producing script',
          );
          assert.match(
            scripts['test:coverage'],
            /\bc8\b.*--reporter=json.*npm run test:coverage:cases/,
            'test:coverage must create Istanbul JSON before executing coverage cases',
          );
          assert.match(
            scripts['test:coverage'],
            /--include=server\/attachment_status\.mjs/,
            'the new bounded refresh module must be instrumented',
          );
          assert.match(
            scripts['test:coverage'],
            /--include=server\/clearfolio\.mjs/,
            'the abortable Clearfolio adapter must be instrumented',
          );
          assert.match(
            scripts['test:coverage:cases'],
            /tests\/unit\/clearfolio-status-signal\.test\.mjs/,
            'the Clearfolio signal and HTTP failure regression must run under c8',
          );
          assert.doesNotMatch(
            scripts['test:coverage:cases'],
            /npm run (?:coverage|test:coverage)(?:\s|$)/,
            'coverage cases must not recursively invoke the coverage wrapper',
          );

          console.log('✓ coverage script contract tests passed');
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Run focused and full verification
        shell: bash
        run: |
          set -euo pipefail
          npm run test:unit
          npm run test:api
          npm run coverage
          test -s coverage/coverage-final.json
          node scripts/ci/static_coverage_evidence.mjs docstrings
          npm run test:e2e:cloud
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const report = JSON.parse(fs.readFileSync('coverage/coverage-final.json', 'utf8'));
          const target = Object.entries(report).find(([name]) =>
            name.replaceAll('\\\\', '/').endsWith('/server/attachment_status.mjs'));
          if (!target) throw new Error('attachment_status.mjs is missing from coverage-final.json');
          const coverage = target[1];
          const misses = [
            ...Object.values(coverage.s),
            ...Object.values(coverage.f),
            ...Object.values(coverage.b).flat(),
          ].filter((hits) => hits === 0);
          if (misses.length) throw new Error(`attachment_status.mjs has ${misses.length} uncovered entries`);
          NODE
          git diff --check

      - name: Commit verified fixes and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/repair-pr-419-coverage.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json server/app.mjs tests/unit/coverage-script-contract.test.mjs .github/workflows/repair-pr-419-coverage.yml
          git commit -m 'fix(ci): make coverage evidence deterministic'
          git push origin HEAD:dependabot/npm_and_yarn/npm_and_yarn-a27be0ffa6
