name: Repair PR 397 session authorization boundary

on:
  push:
    branches:
      - sentinel-fix-calendar-stream-revocation-11666540507854451077
    paths:
      - .github/workflows/repair-pr-397-session-auth.yml
      - .github/scripts/repair_pr_397.py

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out PR branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: sentinel-fix-calendar-stream-revocation-11666540507854451077
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22.13.0
          cache: npm

      - name: Apply bounded session-auth repair
        run: python .github/scripts/repair_pr_397.py

      - name: Install dependencies
        run: npm ci

      - name: Validate repaired security boundary
        run: |
          npm run test:unit
          npm run test:api
          npm run coverage

      - name: Commit validated repair and remove temporary automation
        run: |
          rm .github/workflows/repair-pr-397-session-auth.yml
          rm .github/scripts/repair_pr_397.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/app.mjs tests/api/session-revocation.test.mjs CHANGELOG.md .github/workflows/repair-pr-397-session-auth.yml .github/scripts/repair_pr_397.py
          git commit -m "fix(security): centralize revoked session validation"
          git push origin HEAD:sentinel-fix-calendar-stream-revocation-11666540507854451077
