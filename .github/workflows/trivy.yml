name: Trivy Security Scan

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trivy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  trivy:
    name: trivy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: MEDIUM,HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          limit-severities-for-sarif: true

      - name: Print Trivy findings that failed the gate
        if: failure() && hashFiles('trivy-results.sarif') != ''
        shell: python3 {0}
        run: |
          import json, pathlib

          sarif = json.loads(pathlib.Path("trivy-results.sarif").read_text(encoding="utf-8"))
          findings = []
          for run in sarif.get("runs", []):
              rules = {rule.get("id"): rule for rule in run.get("tool", {}).get("driver", {}).get("rules", [])}
              for result in run.get("results", []):
                  rule_id = result.get("ruleId") or "unknown"
                  rule = rules.get(rule_id, {})
                  severity = rule.get("properties", {}).get("security-severity", "?")
                  message = (result.get("message", {}).get("text") or rule_id).strip().splitlines()[0]
                  locations = result.get("locations", [])
                  if locations:
                      phys = locations[0].get("physicalLocation", {})
                      uri = phys.get("artifactLocation", {}).get("uri", "?")
                      line = phys.get("region", {}).get("startLine", "?")
                      where = f"{uri}:{line}"
                  else:
                      where = "-"
                  findings.append((severity, rule_id, where, message))

          if not findings:
              print("Trivy failed but produced no SARIF findings.")
          else:
              print(f"Trivy filesystem scan reported {len(findings)} MEDIUM-or-higher finding(s):")
              for severity, rule_id, where, message in findings:
                  print(f"  [{severity}] {rule_id} {where} - {message}")

      - name: Upload Trivy SARIF
        if: ${{ always() && hashFiles('trivy-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          sarif_file: trivy-results.sarif
          category: trivy
