name: OSV Scanner

on:
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: osvscanner-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout current protected base revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false
          path: osv-scan-source

      - name: Record resolved protected base checkout
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          test -n "$BASE_REF"
          actual_sha="$(cd osv-scan-source && git rev-parse HEAD)"
          echo "Resolved refs/heads/$BASE_REF to $actual_sha for the OSV baseline scan"

      - name: Scan current protected base dependencies
        id: scan-base
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        continue-on-error: true
        with:
          scan-args: |-
            --format=json
            --output=old-results.json
            --maven-registry=https://maven-central.storage-download.googleapis.com/maven2
            --no-resolve
            -r
            ./osv-scan-source

      - name: Fail closed on incomplete protected-base scan
        if: ${{ steps.scan-base.outcome == 'failure' }}
        env:
          RESULT_FILE: old-results.json
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const resultFile = process.env.RESULT_FILE;
          if (!resultFile) {
            console.error('::error::OSV scan completion guard has no result file');
            process.exit(1);
          }

          let scanResult;
          try {
            scanResult = JSON.parse(readFileSync(resultFile, 'utf8'));
          } catch {
            console.error(`::error::OSV scanner failed without valid JSON evidence in ${resultFile}`);
            process.exit(1);
          }

          if (!scanResult || !Array.isArray(scanResult.results)) {
            console.error(`::error::OSV scanner failed without a results array in ${resultFile}`);
            process.exit(1);
          }

          const vulnerabilities = scanResult.results
            .flatMap((result) => Array.isArray(result?.packages) ? result.packages : [])
            .flatMap((entry) => Array.isArray(entry?.vulnerabilities) ? entry.vulnerabilities : []);

          if (vulnerabilities.length === 0) {
            console.error(`::error::OSV scanner failed without vulnerability evidence in ${resultFile}; refusing ambiguous or incomplete scan output`);
            process.exit(1);
          }
          NODE

      - name: Checkout exact contributor revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          clean: false
          path: osv-scan-source

      - name: Sanitize exact contributor scan tree
        run: |
          set -euo pipefail
          git -C osv-scan-source clean -ffdx
          test -z "$(git -C osv-scan-source status --porcelain)"

      - name: Verify exact contributor checkout
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(cd osv-scan-source && git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_HEAD_SHA"

      - name: Scan exact contributor dependencies
        id: scan-head
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        continue-on-error: true
        with:
          scan-args: |-
            --format=json
            --output=new-results.json
            --maven-registry=https://maven-central.storage-download.googleapis.com/maven2
            --no-resolve
            -r
            ./osv-scan-source

      - name: Fail closed on incomplete contributor scan
        if: ${{ steps.scan-head.outcome == 'failure' }}
        env:
          RESULT_FILE: new-results.json
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const resultFile = process.env.RESULT_FILE;
          if (!resultFile) {
            console.error('::error::OSV scan completion guard has no result file');
            process.exit(1);
          }

          let scanResult;
          try {
            scanResult = JSON.parse(readFileSync(resultFile, 'utf8'));
          } catch {
            console.error(`::error::OSV scanner failed without valid JSON evidence in ${resultFile}`);
            process.exit(1);
          }

          if (!scanResult || !Array.isArray(scanResult.results)) {
            console.error(`::error::OSV scanner failed without a results array in ${resultFile}`);
            process.exit(1);
          }

          const vulnerabilities = scanResult.results
            .flatMap((result) => Array.isArray(result?.packages) ? result.packages : [])
            .flatMap((entry) => Array.isArray(entry?.vulnerabilities) ? entry.vulnerabilities : []);

          if (vulnerabilities.length === 0) {
            console.error(`::error::OSV scanner failed without vulnerability evidence in ${resultFile}; refusing ambiguous or incomplete scan output`);
            process.exit(1);
          }
          NODE

      - name: Compare dependency findings
        uses: google/osv-scanner-action/osv-reporter-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --output=results.sarif
            --old=old-results.json
            --new=new-results.json
            --gh-annotations=true
            --fail-on-vuln=true

      - name: Publish exact-head OSV SARIF to code scanning
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: results.sarif
          checkout_path: osv-scan-source
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          sha: ${{ github.event.pull_request.head.sha }}

      - name: Preserve exact-head OSV SARIF
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scopeweave-osv-${{ github.run_id }}-${{ github.run_attempt }}
          path: results.sarif
          if-no-files-found: error
          retention-days: 3

  manifest-pattern-coverage:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Document manifest coverage
        run: |
          echo 'Recursive OSV scanning covers package-lock.json and requirements(-[A-Za-z0-9._-]+)?\.txt manifests when present.'
