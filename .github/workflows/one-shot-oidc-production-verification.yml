name: One-shot OIDC production verification

on:
  push:
    branches: [fix/oidc-production-verification-20260809]

permissions:
  contents: write

concurrency:
  group: one-shot-oidc-production-verification
  cancel-in-progress: false

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/oidc-production-verification-20260809
          fetch-depth: 0

      - name: Apply reviewable OIDC route patch
        run: python3 scripts/ci/one_shot_oidc_production_patch.py

      - name: Record the security contract in CHANGELOG
        shell: python3 {0}
        run: |
          from pathlib import Path

          path = Path('CHANGELOG.md')
          source = path.read_text(encoding='utf-8')
          anchor = '### Security\n\n'
          entry = '- Replaced the production OIDC payload-decoding stub with discovery, exact issuer binding, S256 PKCE, nonce protection, JWKS-backed RS256 signature verification, audience/authorized-party/time validation, verified-email enforcement, and single-use callback state. The local provider is now restricted to explicit `SCOPEWEAVE_DEV=1`.\n'
          if source.count(anchor) != 1:
              raise SystemExit('expected exactly one Unreleased Security anchor')
          if entry not in source:
              source = source.replace(anchor, anchor + entry, 1)
          path.write_text(source, encoding='utf-8')

      - name: Setup Node 22.13
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run OIDC module, route, API, and coverage verification
        run: |
          node tests/unit/oidc.test.mjs
          node tests/api/oidc-route.test.mjs
          npm run test:unit
          npm run test:api
          npm run coverage

      - name: Commit verified implementation and remove one-shot assets
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-oidc-production-verification.yml
          git rm scripts/ci/one_shot_oidc_production_patch.py
          git add server/app.mjs CHANGELOG.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(oidc): require verified provider identities'
          git push origin HEAD:fix/oidc-production-verification-20260809
