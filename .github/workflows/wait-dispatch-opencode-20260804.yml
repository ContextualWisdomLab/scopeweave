name: Wait for and dispatch protected OpenCode

on:
  push:
    branches:
      - automation/wait-dispatch-opencode-20260804

permissions: read-all

concurrency:
  group: wait-dispatch-protected-opencode-20260804
  cancel-in-progress: true

jobs:
  dispatch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      actions: write
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_WORKFLOW: hourly-opencode-commercial-readiness.yml
      TARGET_BRANCH: develop
    steps:
      - name: Wait for the verified scheduler to reach the protected branch
        id: wait
        shell: bash
        run: |
          set -euo pipefail
          workflow_path=".github/workflows/${TARGET_WORKFLOW}"
          found='false'
          for _ in $(seq 1 120); do
            if gh api "repos/${GITHUB_REPOSITORY}/contents/${workflow_path}?ref=${TARGET_BRANCH}" >/dev/null 2>&1; then
              found='true'
              break
            fi
            sleep 20
          done
          if [[ "$found" != 'true' ]]; then
            echo 'The protected scheduler did not reach develop within the bounded wait.' >&2
            exit 1
          fi
          printf 'found=true\n' >> "$GITHUB_OUTPUT"

      - name: Dispatch one immediate protected commercial-readiness pass
        if: steps.wait.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run "$TARGET_WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref "$TARGET_BRANCH"
          sleep 10
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$TARGET_WORKFLOW" --branch "$TARGET_BRANCH" --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          test -n "$run_id"
          printf 'Dispatched protected OpenCode run `%s`.\n' "$run_id" >> "$GITHUB_STEP_SUMMARY"

      - name: Check out the one-shot branch for cleanup
        if: always()
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: automation/wait-dispatch-opencode-20260804
          persist-credentials: true

      - name: Remove the one-shot dispatcher
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .github/workflows/wait-dispatch-opencode-20260804.yml ]]; then
            rm .github/workflows/wait-dispatch-opencode-20260804.yml
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git commit -m 'chore: remove OpenCode wait dispatcher'
            git push origin HEAD:automation/wait-dispatch-opencode-20260804
          fi
