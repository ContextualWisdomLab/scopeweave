name: One-shot secure Stripe webhook integration

on:
  push:
    branches: [fix/production-billing-fail-closed-20260809]

permissions:
  contents: write

concurrency:
  group: one-shot-secure-stripe-webhook
  cancel-in-progress: false

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/production-billing-fail-closed-20260809
          fetch-depth: 0

      - name: Patch the application trust boundary
        shell: python3 {0}
        run: |
          from pathlib import Path

          path = Path('server/app.mjs')
          source = path.read_text(encoding='utf-8')
          replacements = [
              (
                  "import { PLANS, planOf, orgUsage, wouldExceed, createCheckout } from './billing.mjs';",
                  "import { BillingConfigurationError, PLANS, planOf, orgUsage, wouldExceed, createCheckout } from './billing.mjs';\nimport { StripeWebhookError, processStripeWebhook } from './stripe-webhook.mjs';",
              ),
              (
                  """app.post('/api/orgs/:id/checkout', requireAuth, async (c) => {
            const uid = c.get('user').sub;
            const orgId = c.req.param('id');
            if (orgRole(uid, orgId) !== 'owner') return c.json({ error: 'only the owner can upgrade' }, 403);
            const origin = new URL(c.req.url).origin;
            const session = await createCheckout({ orgId, origin });
            return c.json(session);
          });

          // Stripe webhook (stub). Live mode should verify the signature with
          // STRIPE_WEBHOOK_SECRET before trusting the event — named ceiling.
          app.post('/api/stripe/webhook', async (c) => {
            const event = await c.req.json().catch(() => ({}));
            if (event?.type === 'checkout.session.completed') {
              const orgId = event.data?.object?.client_reference_id || event.data?.object?.metadata?.orgId;
              if (orgId) db.prepare(\"UPDATE orgs SET plan = 'pro' WHERE id = ?\").run(orgId);
            }
            return c.json({ received: true });
          });""",
                  """app.post('/api/orgs/:id/checkout', requireAuth, async (c) => {
            const uid = c.get('user').sub;
            const orgId = c.req.param('id');
            if (orgRole(uid, orgId) !== 'owner') return c.json({ error: 'only the owner can upgrade' }, 403);
            const origin = new URL(c.req.url).origin;
            try {
              const session = await createCheckout({ orgId, origin });
              return c.json(session);
            } catch (error) {
              if (!(error instanceof BillingConfigurationError)) throw error;
              const status = error.code.startsWith('billing_provider_') ? 502 : 503;
              return c.json({ error: error.code }, status);
            }
          });

          // Stripe sends retries and out-of-order events. Verify the exact raw body,
          // apply entitlement changes transactionally, and deduplicate by provider event ID.
          app.post('/api/stripe/webhook', async (c) => {
            let rawBody;
            try {
              rawBody = Buffer.from(await c.req.arrayBuffer());
            } catch {
              return c.json({ error: 'stripe_webhook_body_invalid' }, 400);
            }
            try {
              const result = processStripeWebhook({
                db,
                rawBody,
                signatureHeader: c.req.header('stripe-signature') || '',
                webhookSecret: process.env.STRIPE_WEBHOOK_SECRET || '',
              });
              if (!result.duplicate && result.organizationId != null && result.plan != null) {
                logAudit(
                  result.organizationId,
                  null,
                  'billing.entitlement_sync',
                  'org',
                  result.organizationId,
                  { eventType: result.eventType, plan: result.plan },
                );
                deliver(result.organizationId, 'billing.entitlement_sync', {
                  eventType: result.eventType,
                  plan: result.plan,
                });
              }
              return c.json({ received: true, duplicate: result.duplicate });
            } catch (error) {
              if (!(error instanceof StripeWebhookError)) throw error;
              return c.json({ error: error.code }, error.statusCode);
            }
          });""",
              ),
          ]
          for old, new in replacements:
              occurrences = source.count(old)
              if occurrences != 1:
                  raise SystemExit(f'expected one exact replacement target, found {occurrences}')
              source = source.replace(old, new, 1)
          path.write_text(source, encoding='utf-8')

      - name: Setup Node 22.13
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run billing and API regression suites
        run: |
          node tests/unit/billing-configuration.test.mjs
          node tests/unit/stripe-webhook.test.mjs
          node tests/api/stripe-webhook-route.test.mjs
          npm run test:unit
          npm run test:api
          npm run coverage

      - name: Commit verified application integration and remove one-shot workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-secure-stripe-webhook.yml
          git add server/app.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(billing): require verified Stripe entitlement events'
          git push origin HEAD:fix/production-billing-fail-closed-20260809
