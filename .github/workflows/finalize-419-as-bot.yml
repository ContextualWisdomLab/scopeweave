name: Finalize PR 419 under automation identity

on:
  push:
    branches:
      - dependabot/npm_and_yarn/npm_and_yarn-a27be0ffa6

permissions: read-all

concurrency:
  group: finalize-pr-419-as-bot
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: dependabot/npm_and_yarn/npm_and_yarn-a27be0ffa6
          fetch-depth: 0
          persist-credentials: true

      - name: Remove one-shot workflow and publish bot-authored exact tree
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/finalize-419-as-bot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: finalize reviewed attachment hardening tree'
          git push origin HEAD:dependabot/npm_and_yarn/npm_and_yarn-a27be0ffa6
